name: experiments

on:
  workflow_dispatch:
    inputs:
      which:
        description: "which experiments to run: all | burgers | taylor_green | budgets | kolmogorov | ns_d | exact | spectra | midpoint | criteria3d | adversarial | overnight | leashed | leashed64 | lyapunov | lyapunov_attack | lyapunov_long | lyapunov_global | jacobi | helicity_ladder | strip | kp_ladder | mechanism3d | budgets3d | highres | kolmogorov_v2 | kolmogorov_v3"
        default: "all"
      n3:
        description: "3-D grid for the spectra job"
        default: "48"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install numpy matplotlib scikit-image torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: burgers
        if: ${{ github.event.inputs.which == 'all' || github.event.inputs.which == 'burgers' }}
        run: python -u burgers_entropy.py | tee results/burgers.txt
      - name: taylor_green
        if: ${{ github.event.inputs.which == 'all' || github.event.inputs.which == 'taylor_green' }}
        run: python -u taylor_green.py 2>/dev/null | tee results/taylor_green.txt
      - name: budgets
        if: ${{ github.event.inputs.which == 'all' || github.event.inputs.which == 'budgets' }}
        run: python -u budgets.py 2>/dev/null | tee results/budgets.txt
      - name: ns_d
        if: ${{ github.event.inputs.which == 'all' || github.event.inputs.which == 'ns_d' }}
        run: |
          DIM=1 N=512 NU=0 T=0.95 DT=2e-4 python -u ns_d.py 2>/dev/null | tee results/ns_d_1d.txt
          DIM=2 N=128 NU=0.02 T=2 DT=2e-3 IC=tg python -u ns_d.py 2>/dev/null | tee results/ns_d_2d.txt
          DIM=3 N=48 NU=0 T=4 python -u ns_d.py 2>/dev/null | tee results/ns_d_3d.txt
      - name: exact
        if: ${{ github.event.inputs.which == 'all' || github.event.inputs.which == 'exact' }}
        run: python -u exact_solutions.py 2>/dev/null | tee results/exact_solutions.txt
      - name: spectra
        if: ${{ github.event.inputs.which == 'spectra' }}
        run: |
          N3=${{ github.event.inputs.n3 || 48 }} T3=20 python -u spectra.py 2>/dev/null | tee results/spectra.txt
          git add figures/spectra.png
      - name: midpoint
        if: ${{ github.event.inputs.which == 'midpoint' }}
        run: python -u midpoint.py 2>/dev/null | tee results/midpoint.txt
      - name: criteria3d
        if: ${{ github.event.inputs.which == 'criteria3d' }}
        run: |
          IC=tg N=64 T=4 python -u criteria3d.py 2>/dev/null | tee results/criteria3d_tg_64.txt
          IC=abc N=64 T=4 python -u criteria3d.py 2>/dev/null | tee results/criteria3d_abc_64.txt
          IC=kp N=64 T=3 python -u criteria3d.py 2>/dev/null | tee results/criteria3d_kp_64.txt
      - name: adversarial
        if: ${{ github.event.inputs.which == 'adversarial' }}
        run: |
          N=32 T=1.0 ITERS=40 NVER=96 python -u adversarial_ic.py 2>/dev/null | tee results/adversarial_ic_z0tg_96.txt
          N=32 T=1.0 ITERS=40 NVER=128 python -u adversarial_ic.py 2>/dev/null | tee results/adversarial_ic_z0tg_128.txt
      - name: overnight
        if: ${{ github.event.inputs.which == 'overnight' }}
        run: |
          OBJ=enstrophy N=32 T=1.0 ITERS=60 NVER=96 python -u adversarial_ic.py 2>/dev/null | tee results/overnight_enstrophy_96.txt
          OBJ=helicity HEL=0.0 N=32 T=1.0 ITERS=60 NVER=64 python -u adversarial_ic.py 2>/dev/null | tee results/overnight_helicity_0.txt
          OBJ=helicity HEL=0.5 N=32 T=1.0 ITERS=60 NVER=64 python -u adversarial_ic.py 2>/dev/null | tee results/overnight_helicity_05.txt
          OBJ=helicity HEL=0.9 N=32 T=1.0 ITERS=60 NVER=64 python -u adversarial_ic.py 2>/dev/null | tee results/overnight_helicity_09.txt
          OBJ=jacobi N=32 T=1.0 ITERS=40 NVER=64 python -u adversarial_ic.py 2>/dev/null | tee results/overnight_jacobi.txt
      - name: leashed
        if: ${{ github.event.inputs.which == 'leashed' }}
        run: |
          DMIN=0.30 N=32 T=1.0 ITERS=60 NVER=128 python -u adversarial_ic.py 2>/dev/null | tee results/leashed_dmin030_128.txt
          DMIN=0.45 N=32 T=1.0 ITERS=60 NVER=128 python -u adversarial_ic.py 2>/dev/null | tee results/leashed_dmin045_128.txt
      - name: jacobi
        if: ${{ github.event.inputs.which == 'jacobi' }}
        run: |
          for n in 32 48 64; do IC=tg N=$n T=3 python -u jacobi_ladder.py 2>/dev/null | tee results/jacobi_tg_$n.txt; done
          for n in 32 48 64; do IC=kp N=$n T=1.5 python -u jacobi_ladder.py 2>/dev/null | tee results/jacobi_kp_$n.txt; done
      - name: helicity_ladder
        if: ${{ github.event.inputs.which == 'helicity_ladder' }}
        run: |
          for h in 0.0 0.25 0.5 0.75 0.9; do OBJ=helicity HELMODE=project HEL=$h N=32 T=1.0 ITERS=40 NVER=96 python -u adversarial_ic.py 2>/dev/null | tee results/helicity_proj_$h.txt; done
      - name: strip
        if: ${{ github.event.inputs.which == 'strip' }}
        run: |
          for n in 48 64 96; do IC=tg N=$n T=3 python -u strip_tracker.py 2>/dev/null | tee results/strip_tg_$n.txt; done
          for n in 64 96 128; do IC=kp N=$n T=1.2 EVERY=0.025 python -u strip_tracker.py 2>/dev/null | tee results/strip_kp_$n.txt; done
      - name: leashed64
        if: ${{ github.event.inputs.which == 'leashed64' }}
        run: |
          DMIN=0.30 N=64 T=1.0 ITERS=45 NVERS=128,192 TAG=leashed64_dmin030 python -u adversarial_ic.py 2>/dev/null | tee results/leashed64_dmin030_192.txt
      - name: lyapunov
        if: ${{ github.event.inputs.which == 'lyapunov' }}
        run: |
          TAG=ci32_p0 PHESS=0 N=32 NU=1e-3 T=0.6 ROUNDS=8 TRAIN=200 ADV_ITERS=12 python -u lyapunov_search.py 2>/dev/null | tee results/lyapunov_32_r8_p0.txt
          TAG=ci32_p1 PHESS=1 N=32 NU=1e-3 T=0.6 ROUNDS=8 TRAIN=200 ADV_ITERS=12 python -u lyapunov_search.py 2>/dev/null | tee results/lyapunov_32_r8_p1.txt
      - name: lyapunov_attack
        if: ${{ github.event.inputs.which == 'lyapunov_attack' }}
        run: |
          ATTACK=results/lyapunov_g_ci32_p0.pt N=32 NU=1e-3 T=0.6 ADV_ITERS=40 RESTARTS=4 TRAIN=0 python -u lyapunov_search.py 2>/dev/null | tee results/lyapunov_32_p0_attack.txt
          ATTACK=results/lyapunov_g_ci32_p1.pt PHESS=1 N=32 NU=1e-3 T=0.6 ADV_ITERS=40 RESTARTS=4 TRAIN=0 python -u lyapunov_search.py 2>/dev/null | tee results/lyapunov_32_p1_attack.txt
      - name: lyapunov_long
        if: ${{ github.event.inputs.which == 'lyapunov_long' }}
        run: |
          TAG=ci32_p0_r20 PHESS=0 N=32 NU=1e-3 T=0.6 ROUNDS=20 TRAIN=200 ADV_ITERS=25 python -u lyapunov_search.py 2>/dev/null | tee results/lyapunov_32_r20_p0.txt
      - name: lyapunov_global
        if: ${{ github.event.inputs.which == 'lyapunov_global' }}
        run: |
          TAG=ci32_g1 GLOBAL=1 PHESS=0 N=32 NU=1e-3 T=0.6 ROUNDS=8 TRAIN=200 ADV_ITERS=12 python -u lyapunov_search.py 2>/dev/null | tee results/lyapunov_32_r8_g1.txt
      - name: kp_ladder
        if: ${{ github.event.inputs.which == 'kp_ladder' }}
        run: |
          IC=kp N=64 T=2.5 python -u criteria3d.py 2>/dev/null | tee results/kp_64.txt
          IC=kp N=96 T=2.5 python -u criteria3d.py 2>/dev/null | tee results/kp_96.txt
          IC=kp N=128 T=2.5 python -u criteria3d.py 2>/dev/null | tee results/kp_128.txt
          IC=kp N=64 T=2.5 NU=1e-3 python -u criteria3d.py 2>/dev/null | tee results/kp_64_nu1e-3.txt
      - name: mechanism3d
        if: ${{ github.event.inputs.which == 'mechanism3d' }}
        run: |
          IC=tg N=64 T=4 python -u mechanism3d.py 2>/dev/null | tee results/mechanism3d_tg_64.txt
          IC=abc N=64 T=4 python -u mechanism3d.py 2>/dev/null | tee results/mechanism3d_abc_64.txt
      - name: budgets3d
        if: ${{ github.event.inputs.which == 'budgets3d' }}
        run: N=64 T=4 python -u budgets3d.py 2>/dev/null | tee results/budgets3d_64.txt
      - name: highres
        if: ${{ github.event.inputs.which == 'highres' }}
        run: |
          N=96 T=4 python -u budgets3d.py 2>/dev/null | tee results/budgets3d_96.txt
          N=128 T=4 python -u budgets3d.py 2>/dev/null | tee results/budgets3d_128.txt
      - name: kolmogorov_v3
        if: ${{ github.event.inputs.which == 'kolmogorov_v3' }}
        run: python -u kolmogorov_v3.py 2>/dev/null | tee results/kolmogorov_v3.txt
      - name: kolmogorov_v2
        if: ${{ github.event.inputs.which == 'kolmogorov_v2' }}
        run: python -u kolmogorov_v2.py 2>/dev/null | tee results/kolmogorov_v2.txt
      - name: kolmogorov
        if: ${{ github.event.inputs.which == 'all' || github.event.inputs.which == 'kolmogorov' }}
        run: python -u kolmogorov_closure.py 2>/dev/null | tee results/kolmogorov.txt
      - name: commit results
        run: |
          git config user.name "experiments-bot"
          git config user.email "actions@github.com"
          git add results figures
          git diff --cached --quiet || git commit -m "results: $(date -u +%Y-%m-%dT%H:%MZ) run ${{ github.run_id }}"
          git pull --rebase origin master && git push
      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_id }}
          path: results/
